<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Mestbankgegevens</title>
  <style>
    body { margin: 0; font-family: Tahoma, Arial, sans-serif; font-size: 12px; background: #d4d0c8; }
    .scherm { display: flex; height: 100vh; }

    .klantenlijst-kolom { width: 220px; background: white; border-right: 2px solid #888; display: flex; flex-direction: column; }
    .klantenlijst-zoek { padding: 6px; border-bottom: 1px solid #ccc; }
    .klantenlijst-zoek input { width: 100%; box-sizing: border-box; padding: 4px; }
    .klantenlijst { flex: 1; overflow-y: auto; }
    .klant-item { display: flex; padding: 3px 6px; cursor: pointer; border-bottom: 1px solid #eee; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .klant-item .nr { width: 55px; color: #444; flex-shrink: 0; }
    .klant-item:hover { background: #eef4ff; }
    .klant-item.actief { background: #cfe2ff; font-weight: bold; }

    .detail-kolom { flex: 1; overflow-y: auto; padding: 12px 18px; }
    .detail-kolom h1 { font-size: 16px; border-bottom: 1px solid #999; padding-bottom: 4px; }

    .sectie { background: white; border: 1px solid #999; margin-bottom: 14px; }
    .sectie-titel { background: #003399; color: white; padding: 4px 8px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
    .sectie-titel button { font-size: 11px; padding: 2px 8px; }
    .sectie-inhoud { padding: 8px; }

    .veldrij { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
    .veldrij label { font-size: 11px; color: #333; }
    .veldrij input, .veldrij select { padding: 2px; border: 1px solid #888; font-size: 12px; }

    table.grid { border-collapse: collapse; width: 100%; font-size: 11px; }
    table.grid th { background: #e8e8e8; border: 1px solid #bbb; padding: 3px; text-align: left; white-space: nowrap; }
    table.grid td { border: 1px solid #ddd; padding: 2px; white-space: nowrap; }
    table.grid input, table.grid select { width: 100%; box-sizing: border-box; border: none; font-size: 11px; padding: 1px; }
    table.grid .actie-cel { white-space: nowrap; }
    table.grid .actie-cel button { font-size: 10px; padding: 1px 5px; }

    .toevoeg-knop { margin-top: 6px; font-size: 11px; padding: 3px 10px; }

    a.terug-icoon { display: inline-block; margin: 10px 0; text-decoration: none; font-size: 18px; }
  </style>
</head>
<body>
  <div class="scherm">
    <div class="klantenlijst-kolom">
      <div class="klantenlijst-zoek"><input type="text" id="zoekklant" placeholder="Zoeken op naam of nr..."></div>
      <div class="klantenlijst" id="klantenlijst"></div>
    </div>

    <div class="detail-kolom">
      <h1 id="titel">Mestbankgegevens</h1>
      <a href="schakelbord.html" class="terug-icoon" title="Terug naar hoofdmenu">🚪 Terug naar hoofdmenu</a>

      <div class="sectie">
        <div class="sectie-titel">Identificatie (mestbank gegevens nutriëntenhalte)</div>
        <div class="sectie-inhoud" id="sectie-identificatie"></div>
      </div>

      <div class="sectie">
        <div class="sectie-titel">Overzicht NER</div>
        <div class="sectie-inhoud" id="sectie-ner"></div>
      </div>

      <div class="sectie">
        <div class="sectie-titel">Stalbezetting</div>
        <div class="sectie-inhoud" id="sectie-stalbezetting"></div>
      </div>

      <div class="sectie">
        <div class="sectie-titel" id="rv-titel">Melk / RV</div>
        <div class="sectie-inhoud" id="sectie-rv"></div>
      </div>

      <div class="sectie">
        <div class="sectie-titel" id="dieren-titel">Mestbank dieren</div>
        <div class="sectie-inhoud" id="sectie-dieren"></div>
      </div>

      <div class="sectie">
        <div class="sectie-titel">Stock voeder</div>
        <div class="sectie-inhoud" id="sectie-stockvoeder"></div>
      </div>

      <div class="sectie">
        <div class="sectie-titel">Andere voeders</div>
        <div class="sectie-inhoud" id="sectie-anderevoeders"></div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/mestbankgegevens.js"></script>
</body>
</html>
