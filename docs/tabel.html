<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Boerderijbeheer - Tabel</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a href="dashboard.html" class="terug-link">&larr; Terug naar overzicht</a>
  <h1 id="tabel-titel">Tabel</h1>

  <div class="categorie-blok" id="nieuwe-rij-blok">
    <h2>Nieuwe rij toevoegen</h2>
    <form id="nieuwe-rij-form"></form>
    <p id="toevoeg-melding" style="color:#16a34a; display:none;">Rij toegevoegd.</p>
    <p id="toevoeg-fout" style="color:red; display:none;"></p>
  </div>

  <div class="werkbalk">
    <input type="text" id="zoekveld" placeholder="Zoeken in tekstkolommen...">
    <button id="zoek-btn">Zoeken</button>
  </div>

  <div class="data-tabel-wrapper">
    <table id="data-tabel">
      <thead><tr id="header-rij"></tr></thead>
      <tbody id="body-rijen"></tbody>
    </table>
  </div>

  <div class="paginering">
    <button id="vorige-btn">&larr; Vorige</button>
    <span id="pagina-info">pagina 1</span>
    <button id="volgende-btn">Volgende &rarr;</button>
  </div>

  <script src="js/api.js"></script>
  <script src="js/tabel.js"></script>
</body>
</html>
