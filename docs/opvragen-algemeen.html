<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Algemene gegevens</title>
  <style>
    body { margin: 0; font-family: Tahoma, Arial, sans-serif; font-size: 13px; background: #d4d0c8; }

    .scherm {
      display: flex;
      height: 100vh;
    }

    /* --- Linkerkolom: klantenlijst --- */
    .klantenlijst-kolom {
      width: 220px;
      background: white;
      border-right: 2px solid #888;
      display: flex;
      flex-direction: column;
    }
    .klantenlijst-zoek {
      padding: 6px;
      border-bottom: 1px solid #ccc;
    }
    .klantenlijst-zoek input {
      width: 100%;
      box-sizing: border-box;
      padding: 4px;
    }
    .klantenlijst {
      flex: 1;
      overflow-y: auto;
    }
    .klant-item {
      display: flex;
      padding: 3px 6px;
      cursor: pointer;
      border-bottom: 1px solid #eee;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .klant-item .nr { width: 55px; color: #444; flex-shrink: 0; }
    .klant-item:hover { background: #eef4ff; }
    .klant-item.actief { background: #cfe2ff; font-weight: bold; }

    /* --- Rechterkolom: detailformulier --- */
    .detail-kolom {
      flex: 1;
      overflow-y: auto;
      padding: 15px 25px;
    }
    .detail-kolom h1 {
      font-size: 16px;
      font-weight: bold;
      border-bottom: 1px solid #999;
      padding-bottom: 4px;
    }
    .knoppenrij {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin: -30px 0 15px 0;
    }
    .knoppenrij button {
      padding: 8px 14px;
      background: linear-gradient(to bottom, #fdfdfd, #e2e2e2);
      border: 1px solid #999;
      box-shadow: 1px 1px 2px rgba(0,0,0,0.2);
      cursor: pointer;
    }
    .veldrij {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .veldrij label { width: 130px; flex-shrink: 0; text-align: right; }
    .veldrij input[type="text"], .veldrij input[type="number"], .veldrij select {
      padding: 3px;
      border: 1px solid #888;
      width: 260px;
    }
    .veldrij.klein input, .veldrij.klein select { width: 140px; }
    .vinkrij { display: flex; align-items: center; gap: 6px; margin: 6px 0; }
    .vinkrij label { text-align: left; width: auto; }

    .sectie {
      border-top: 2px solid #333;
      margin-top: 20px;
      padding-top: 10px;
    }
    .sectie h2 { font-size: 14px; font-style: italic; }

    .navigator {
      position: sticky;
      bottom: 0;
      background: #d4d0c8;
      border-top: 1px solid #888;
      padding: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .navigator button { padding: 4px 10px; }
    .navigator .info { font-size: 12px; }

    .top-rechts {
      float: right;
      text-align: right;
    }

    a.terug-icoon {
      display: inline-block;
      margin-top: 15px;
      text-decoration: none;
      font-size: 20px;
    }

    fieldset { border: 1px solid #ccc; margin-top: 8px; }
    fieldset[disabled] { opacity: 0.55; }
  </style>
</head>
<body>
  <div class="scherm">
    <div class="klantenlijst-kolom">
      <div class="klantenlijst-zoek">
        <input type="text" id="zoekklant" placeholder="Zoeken op naam of nr...">
      </div>
      <div class="klantenlijst" id="klantenlijst"></div>
    </div>

    <div class="detail-kolom">
      <div class="top-rechts">
        <button id="btn-toevoegen">Gegevens toevoegen</button>
        <button id="btn-opslaan">Gegevens opslaan</button>
        <br><br>
        <div class="vinkrij" style="justify-content:flex-end;">
          <input type="checkbox" id="f_mb"> <label for="f_mb">mestbank invullen?</label>
        </div>
        <div class="veldrij klein" style="justify-content:flex-end;">
          <label for="f_vertegenw" style="width:auto;">vertegenw:</label>
          <select id="f_vertegenw"><option value="">-</option></select>
        </div>
      </div>

      <h1>Algemene gegevens</h1>

      <div class="veldrij"><label>klantnummer:</label><input type="text" id="f_klantnr" disabled></div>
      <div class="veldrij"><label>naam:</label><input type="text" id="f_naam"></div>
      <div class="veldrij"><label>Adres1:</label><input type="text" id="f_adres1"></div>
      <div class="veldrij"><label>Adres2:</label><input type="text" id="f_adres2"></div>
      <div class="veldrij">
        <label>gemeente:</label>
        <select id="f_gemeente_id"><option value="">-</option></select>
      </div>
      <div class="veldrij klein"><label>telefoon:</label><input type="text" id="f_telefoon">
        <label style="width:auto;">gsm:</label><input type="text" id="f_gsm">
        <label style="width:auto;">fax:</label><input type="text" id="f_faxnummer">
      </div>
      <div class="veldrij klein"><label>BTW:</label><input type="text" id="f_btw">
        <label style="width:auto;">e-mail:</label><input type="text" id="f_email">
      </div>
      <div class="veldrij"><label>rekeningnummer:</label><input type="text" id="f_reknr"></div>

      <div class="vinkrij">
        <input type="checkbox" id="f_klant">
        <label for="f_klant">Is dit een afnemer van voeders?</label>
        <label style="margin-left:20px;">Sedert wanneer? (2000 = sedert lang)</label>
        <input type="number" id="f_beginkl" style="width:80px;">
      </div>
      <div class="vinkrij">
        <input type="checkbox" id="f_expobe">
        <label for="f_expobe">Wordt een nederlandstalige uitnodiging verstuurd voor de beurs te Roeselare?</label>
      </div>
      <div class="vinkrij">
        <input type="checkbox" id="f_mestbank">
        <label for="f_mestbank">Uitnodiging versturen voor het invullen van mestbankaangifte</label>
      </div>
      <div class="vinkrij">
        <input type="checkbox" id="f_expofr">
        <label for="f_expofr">Wordt een franstalige uitnodiging verstuurd voor de beurs te Roeselare?</label>
      </div>
      <div class="vinkrij">
        <input type="checkbox" id="f_granen">
        <label for="f_granen">Worden granen geleverd?</label>
      </div>
      <div class="vinkrij">
        <input type="checkbox" id="f_premies">
        <label for="f_premies">Uitnodiging versturen voor het invullen van de premies</label>
      </div>
      <div class="vinkrij">
        <input type="checkbox" id="f_vl">
        <label for="f_vl">Worden vleesvarkens geleverd aan Vanlandschoot?</label>
      </div>

      <div class="sectie">
        <h2>Gegevens Sanitel</h2>
        <button id="btn-sanitel-toevoegen">Gegevens toevoegen</button>
        <fieldset id="sanitel-velden" disabled>
          <div class="veldrij klein"><label>beslagnr:</label><input type="text" id="f_beslagnr">
            <label style="width:auto;">paswoord AB register:</label><input type="text" id="f_pasw_abregister">
            <label style="width:auto;">login veeportaal:</label><input type="text" id="f_login_veeportaal">
          </div>
          <div class="veldrij klein"><label>beslagcode:</label><input type="text" id="f_beslagcode">
            <label style="width:auto;">paswoord veeportaal:</label><input type="text" id="f_pasw_veeportaal">
          </div>
          <div class="veldrij klein"><label>zeugen:</label><input type="number" id="f_zeugen">
            <input type="checkbox" id="f_verkoopbiggen"> <label for="f_verkoopbiggen" style="width:auto;">verkoop biggen</label>
          </div>
          <div class="veldrij klein"><label>mestvarkens:</label><input type="number" id="f_mestvarkens">
            <input type="checkbox" id="f_aankoopbiggen"> <label for="f_aankoopbiggen" style="width:auto;">aankoop biggen</label>
          </div>
        </fieldset>
      </div>

      <a href="menu-algemene-gegevens.html" class="terug-icoon" title="Terug naar menu">🚪</a>
    </div>
  </div>

  <div class="navigator">
    <button id="nav-eerste">|&lt;</button>
    <button id="nav-vorige">&lt;</button>
    <span class="info" id="nav-info">record 0 van 0</span>
    <button id="nav-volgende">&gt;</button>
    <button id="nav-laatste">&gt;|</button>
  </div>

  <script src="js/api.js"></script>
  <script src="js/opvragen-algemeen.js"></script>
</body>
</html>
